[package]
name = "runtime"
description = "Async actors: UDP proxy, WebSocket, watchers, supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
proxy-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
futures-util.workspace = true
uuid.workspace = true
secrecy.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
tokio-tungstenite.workspace = true
base64.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tokio-util = { workspace = true, features = ["rt"] }
jsonschema = { version = "0.47", default-features = false }

[lints]
workspace = true
