[[permission]]
identifier = "allow-app-commands"
description = "Allow all custom application IPC commands"
commands.allow = [
  "get_bootstrap_state",
  "get_runtime_state",
  "get_sso_status",
  "get_sso_accounts",
  "get_sso_backends",
  "set_sso_token",
  "clear_sso_token",
  "set_sso_backend",
  "reconnect_sso",
  "get_app_config",
  "save_app_config",
  "get_local_data",
  "save_local_data",
  "reload_local_data",
  "get_eq_settings",
  "set_eq_directory",
  "browse_eq_executable",
  "get_changelog",
  "fetch_github_changelog",
  "check_for_updates",
  "install_update",
  "clear_logs",
  "get_proxy_settings",
  "update_proxy_settings",
  "set_proxy_mode_selection",
  "update_listen_port",
  "get_recent_logs",
  "launch_everquest",
  "reset_eqhost_backup",
  "restore_eqhost_backup",
  "save_eqhost_contents",
  "open_eq_folder",
  "show_window",
  "hide_window",
  "request_shutdown",
]
